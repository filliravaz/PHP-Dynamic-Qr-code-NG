version: "3.2"
services:
  php-dynamic-qrcode:
    image: "ghcr.io/filliravaz/php-dynamic-qr-code-ng:latest"
    restart: "unless-stopped"
    environment:
      TYPE: "docker"
      QRCODE_GENERATOR: "internal-chillerlan.qrcode"
      BASE_URL: "https://mydomain.com"
      DATABASE_HOST: "php-dynamic-qrcode-db"
      DATABASE_PORT: "3306"
      DATABASE_NAME: "qrcode"
      DATABASE_USER: "qrcode"
      DATABASE_PASSWORD: "changeme"
      DATABASE_PREFIX: ""
      DATABASE_CHARSET: "utf8"
    ports:
      - 80:80
    depends_on:
      - php-dynamic-qrcode-db
    volumes:
      - php_dynamic_qrcode_saved_qrcode_data:/var/www/html/saved_qrcode
    networks:
      - php-dynamic-qrcode-network

  php-dynamic-qrcode-db:
    # -------------------------------------------------------------------------
    # Database Migration Notice (MySQL 8 to MariaDB 11.4 LTS):
    # Do NOT directly reuse an existing MySQL 8 data volume (php_dynamic_qrcode_db_data)
    # with MariaDB 11.4 due to incompatible InnoDB table structures and redo log formats.
    #
    # Recommended Migration Path:
    # 1. Logical Export of application database from existing MySQL 8 container:
    #    Create a temporary client option file inside the container (e.g. /tmp/my.cnf, chmod 600):
    #      [client]
    #      user=root
    #      password=your_root_password
    #    Export only the application database (avoiding system tables from --all-databases):
    #      docker exec <mysql8_container> mysqldump --defaults-extra-file=/tmp/my.cnf qrcode --routines --triggers > qrcode_dump.sql
    #    Remove /tmp/my.cnf after export. User credentials and grants should be managed
    #    separately via standard MariaDB CREATE USER and GRANT syntax or Compose environment variables.
    # 2. Test Import on a temporary test volume:
    #    docker run --name test-mariadb -v test_mariadb_data:/var/lib/mysql -e MARIADB_ROOT_PASSWORD=changeme -d mariadb:11.4
    #    docker exec -i test-mariadb mariadb --defaults-extra-file=/tmp/my.cnf qrcode < qrcode_dump.sql
    # 3. Validation: Verify MariaDB startup logs and test data access:
    #    docker logs test-mariadb
    #    docker exec -it test-mariadb mariadb --defaults-extra-file=/tmp/my.cnf -e "SHOW TABLES IN qrcode; SELECT COUNT(*) FROM qrcode.users;"
    # 4. Production Switch: Stop the MySQL container, initialize a fresh volume for MariaDB,
    #    import qrcode_dump.sql into the production MariaDB container, and clean up temporary test resources.
    # -------------------------------------------------------------------------
    image: "mariadb:11.4"
    restart: "unless-stopped"
    volumes:
      - php_dynamic_qrcode_db_data:/var/lib/mysql
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - '13306:3306'
    environment:
      MYSQL_ROOT_PASSWORD: "changeme"
      MYSQL_DATABASE: "qrcode"
      MYSQL_USER: "qrcode"
      MYSQL_PASSWORD: "changeme"
    networks:
      - php-dynamic-qrcode-network

volumes:
  php_dynamic_qrcode_db_data:
  php_dynamic_qrcode_saved_qrcode_data:

networks:
  php-dynamic-qrcode-network:
