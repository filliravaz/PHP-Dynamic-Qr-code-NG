version: "3.2"
services:
  php-dynamic-qrcode:
    image: "ghcr.io/filliravaz/php-dynamic-qr-code-ng:latest"
    restart: "unless-stopped"
    environment:
      TYPE: "docker"
      QRCODE_GENERATOR: "internal-chillerlan.qrcode"
      BASE_URL: "https://mydomain.com"
      DATABASE_HOST: "php-dynamic-qrcode-db"
      DATABASE_PORT: "3306"
      DATABASE_NAME: "qrcode"
      DATABASE_USER: "qrcode"
      DATABASE_PASSWORD: "changeme"
      DATABASE_PREFIX: ""
      DATABASE_CHARSET: "utf8"
    ports:
      - 80:80
    depends_on:
      - php-dynamic-qrcode-db
    volumes:
      - php_dynamic_qrcode_saved_qrcode_data:/var/www/html/saved_qrcode
    networks:
      - php-dynamic-qrcode-network

  php-dynamic-qrcode-db:
    # -------------------------------------------------------------------------
    # Database Migration Notice (MySQL 8 to MariaDB 11.4 LTS):
    # Do NOT directly reuse an existing MySQL 8 data volume (php_dynamic_qrcode_db_data)
    # with MariaDB 11.4 due to incompatible InnoDB table structures and redo log formats.
    #
    # Recommended Migration Path for Existing Deployments:
    # 1. Logical Export of application database from existing MySQL 8 container:
    #    a. Create temporary client option file inside the MySQL 8 container:
    #       docker exec <mysql8_container> sh -c "printf '[client]\nuser=root\npassword=your_root_password\n' > /tmp/my.cnf && chmod 600 /tmp/my.cnf"
    #    b. Export application database (avoiding system tables from --all-databases):
    #       docker exec <mysql8_container> mysqldump --defaults-extra-file=/tmp/my.cnf qrcode --routines --triggers > qrcode_dump.sql
    #    c. Clean up option file:
    #       docker exec <mysql8_container> rm -f /tmp/my.cnf
    #
    # 2. Test Import and Validation on a temporary test volume:
    #    a. Start temporary MariaDB 11.4 container with database and credentials:
    #       docker run --name test-mariadb -v test_mariadb_data:/var/lib/mysql -e MARIADB_ROOT_PASSWORD=changeme -e MARIADB_DATABASE=qrcode -d mariadb:11.4
    #    b. Execute import on the fresh volume:
    #       docker exec -i test-mariadb mariadb -uroot -pchangeme qrcode < qrcode_dump.sql
    #    c. Validate startup and access:
    #       docker logs test-mariadb
    #       docker exec -it test-mariadb mariadb -uroot -pchangeme -e "SHOW TABLES IN qrcode;"
    #    d. Clean up test container and test volume:
    #       docker rm -f test-mariadb && docker volume rm test_mariadb_data
    #
    # 3. Production Migration Procedure:
    #    a. When migrating an existing deployment, temporarily disable the database/init.sql mount below
    #       (e.g., comment out `./database/init.sql:...` under volumes). This explicitly prevents init.sql
    #       from running on the fresh volume and falsely recording schema_version = 2.0.0 before migration.
    #    b. Start the database service on a fresh MariaDB volume:
    #       docker compose up -d php-dynamic-qrcode-db
    #    c. Import qrcode_dump.sql into the running database:
    #       docker compose exec -T php-dynamic-qrcode-db mariadb -uroot -pchangeme qrcode < qrcode_dump.sql
    #    d. Execute the database schema upgrade inside the PHP container:
    #       docker compose run --rm php-dynamic-qrcode php src/upgrade/upgrade.php
    #    e. Re-enable the database/init.sql mount in docker-compose.yml for future fresh installs,
    #       then start the full application stack:
    #       docker compose up -d
    #
    # Fresh installations (no existing data) automatically use the mounted database/init.sql below.
    # -------------------------------------------------------------------------
    image: "mariadb:11.4"
    restart: "unless-stopped"
    volumes:
      - php_dynamic_qrcode_db_data:/var/lib/mysql
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - '13306:3306'
    environment:
      MYSQL_ROOT_PASSWORD: "changeme"
      MYSQL_DATABASE: "qrcode"
      MYSQL_USER: "qrcode"
      MYSQL_PASSWORD: "changeme"
    networks:
      - php-dynamic-qrcode-network

volumes:
  php_dynamic_qrcode_db_data:
  php_dynamic_qrcode_saved_qrcode_data:

networks:
  php-dynamic-qrcode-network:
