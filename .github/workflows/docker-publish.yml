name: Build and Publish Docker Image

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Lowercase repository name for GHCR
        run: |
          echo "IMAGE_NAME=${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Compute version metadata
        id: version_meta
        env:
          GIT_SHA: ${{ github.sha }}
          GIT_REF: ${{ github.ref }}
          GIT_REF_NAME: ${{ github.ref_name }}
        run: |
          SHORT_SHA="${GIT_SHA:0:7}"
          if [[ "$GIT_REF" == refs/tags/* ]]; then
            CLEAN_VERSION="${GIT_REF_NAME#v}"
            echo "channel=LTS" >> "$GITHUB_OUTPUT"
            echo "version=$CLEAN_VERSION" >> "$GITHUB_OUTPUT"
            echo "commit=$SHORT_SHA" >> "$GITHUB_OUTPUT"
          else
            echo "channel=Nightly" >> "$GITHUB_OUTPUT"
            echo "version=$SHORT_SHA" >> "$GITHUB_OUTPUT"
            echo "commit=$SHORT_SHA" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ env.IMAGE_NAME }}
          flavor: |
            latest=auto
          tags: |
            # When pushed to main / master: tag as nightly and commit ID
            type=raw,value=nightly,enable=${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' }}
            type=sha,format=short,prefix=,enable=${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' }}
            type=sha,format=short,prefix=nightly-,enable=${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' }}
            # When a version tag is pushed (e.g. v1.2.3 or v2.3):
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=${{ github.ref_name }},enable=${{ startsWith(github.ref, 'refs/tags/') }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_CHANNEL=${{ steps.version_meta.outputs.channel }}
            APP_VERSION=${{ steps.version_meta.outputs.version }}
            APP_COMMIT=${{ steps.version_meta.outputs.commit }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
