name: PR CI Checks

on:
  pull_request:
    branches:
      - main
      - master
      - dev
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint-and-smoke-test:
    name: PHP 8.4 Lint, DB Migration & QR Smoke Test
    runs-on: ubuntu-latest

    services:
      mariadb:
        image: mariadb:11.4
        env:
          MYSQL_ROOT_PASSWORD: rootpassword
          MYSQL_DATABASE: qrcode_test
          MYSQL_USER: qrcode_user
          MYSQL_PASSWORD: qrcode_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: bcmath, bz2, calendar, exif, gd, gettext, imagick, intl, mysqli, pdo_mysql, zip
          coverage: none
          tools: composer:v2

      - name: Validate composer.json and install dependencies
        run: |
          composer validate --no-check-publish
          composer install --no-interaction --prefer-dist --optimize-autoloader
          cp -r vendor src/vendor

      - name: Lint all PHP files (php -l)
        run: |
          find src -type f -name "*.php" -print0 | xargs -0 -n1 -P4 php -l

      - name: Check custom JavaScript syntax (node --check)
        run: |
          node --check src/dist/js/custom.js
          node --check src/dist/js/qr-preview.js

      - name: Run Database Migration & QR Generator Smoke Test
        env:
          TYPE: docker
          DATABASE_HOST: 127.0.0.1
          DATABASE_PORT: '3306'
          DATABASE_NAME: qrcode_test
          DATABASE_USER: qrcode_user
          DATABASE_PASSWORD: qrcode_password
          DATABASE_PREFIX: ''
          DATABASE_CHARSET: utf8mb4
          QRCODE_GENERATOR: internal-endroid.qrcode
          BASE_URL: http://localhost
        run: |
          php -r '
            require_once "src/config/config.php";
            $db = getDbInstance();
            $mysqli = $db->mysqli();

            // 1. Verify all core tables were auto-seeded
            if (!MigrationManager::hasAllCoreTables($mysqli, "")) {
                fwrite(STDERR, "FAIL: Not all core tables were created by MigrationManager.\n");
                exit(1);
            }

            // 2. Verify latest schema version is recorded
            $latest = MigrationManager::getLatestVersion();
            if (!MigrationManager::hasVersionRecord($mysqli, "", $latest)) {
                fwrite(STDERR, "FAIL: Latest schema version ($latest) not recorded.\n");
                exit(1);
            }

            // 3. Verify default superadmin user exists with must_change_password = 1
            $admin = $db->where("username", "superadmin")->getOne("users");
            if (!$admin || (int)$admin["must_change_password"] !== 1) {
                fwrite(STDERR, "FAIL: Default superadmin account was not provisioned properly.\n");
                exit(1);
            }

            echo "OK: Database auto-seeding and migrations verified (version $latest).\n";
          '

  docker-build-check:
    name: Docker Build Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Test Docker image build (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: false
          provenance: false
          build-args: |
            APP_CHANNEL=CI
            APP_VERSION=pr-check
            APP_COMMIT=${{ github.sha }}
          cache-from: type=gha,scope=amd64
